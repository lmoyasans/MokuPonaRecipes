title: Kombucha Tom Collins
dinner: 2025-09-06-earth-beneath-us
description: A ginger-kombucha spin on a Tom Collins, served at The Earth Beneath Us.
servings: 1
prepTime: 5 min
difficulty: easy
tags: [cocktail]
ingredients:
  - 45ml vodka
  - 15ml lemon juice
  - 15ml cinnamon syrup (equal parts sugar and water, simmered with a cinnamon stick)
  - 45ml ginger kombucha
  - Soda water, to top up
  - Ice
  - A piece of ginger, to garnish
steps:
  - Combine the vodka, lemon juice and cinnamon syrup in a glass over ice.
  - Top with the ginger kombucha, then soda water to taste.
  - Stir gently and garnish with a piece of ginger.
