title: Stuffed Cabbage in a Roasted Pepper & Tomato Sauce
dinner: 2023-01-29-test-dinner
description: >
  Cabbage rolls stuffed with aubergine, walnuts, rice and beans, served in
  a roasted red pepper and tomato sauce with parsley oil. Transcribed from
  the original handwritten recipe notes.
servings: 6
prepTime: 1.5 hours
cookTime: 1.5 hours
difficulty: hard
tags: [mains, vegan, hands-on]
ingredients:
  - "For the sauce: 3 red bell peppers, 1 can chopped tomatoes, 4 tsp tomato purée, 1 bulb garlic, a bundle of parsley, 2 red onions, 1 carrot"
  - "For the filling: 1 large white cabbage, 4 aubergines, 100g white rice (cooked), 100g walnuts, 1 can beans (drained), 1 tsp coriander, 1 tbsp cumin, 1 tsp marjoram, 2 tsp cinnamon"
  - "For the parsley oil: 1 bundle parsley, 100ml olive oil"
  - "To serve: sour cream, slices of brown bread, butter"
steps:
  - Cook the rice and set aside to cool.
  - "Sauce: roast the peppers until the skins blacken, peel, and blend with the canned tomatoes. Cook the diced onion and carrot in oil, add the tomato purée and let it caramelise, then add the garlic and the blended pepper-tomato mixture. Simmer until it forms a sauce."
  - Roast the peeled aubergines with plenty of oil until they start to fall apart, about 1 hour (don't let them burn). Roast the walnuts and crush into small pieces.
  - Peel the cabbage leaves off whole and boil until soft and pliable.
  - Mix the spices, roasted aubergine, beans, cooked rice and crushed walnuts into a well-combined filling.
  - Stuff and roll the filling into the cabbage leaves. Nestle the rolls into the tomato sauce and simmer gently until heated through.
  - Blend the parsley with the olive oil to make the parsley oil.
  - "To serve: plate two rolls over a pool of the tomato sauce, drizzle with parsley oil, add a small spoon of sour cream, and serve with a slice of brown bread fried in butter."
