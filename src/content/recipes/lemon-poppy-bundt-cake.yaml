title: Lemon Poppy Seed Bundt Cake with Blueberry Sorbet
dinner: 2025-03-29-rgb-tasting-colors
description: >
  The "blue" course of the RGB dinner — a lemon-poppy seed bundt cake with
  a butterfly-pea-flower blue icing, served with blueberry sorbet and a
  baked custard. Scaled down from the original event-sized batch.
servings: 8
prepTime: 1.5 hours (plus overnight chilling)
cookTime: 1 hour
difficulty: hard
tags: [dessert, vegetarian-option]
ingredients:
  - "For the cake: 420g all-purpose flour, 6g baking soda, 3g salt, 175g plain yogurt, 75g whole milk, zest of 3 lemons, juice of 1.5 lemons, 200g unsalted butter (chilled, cubed), 380g caster sugar, 5 eggs, 50g poppy seeds"
  - "For the lemon soaking syrup: 100g lemon juice, 100g caster sugar"
  - "For the baked custard: 200ml double cream, 200g milk, 75g light brown sugar, seeds of 1 vanilla pod, 4 egg yolks, ½ tsp salt"
  - "For the blueberry sorbet: 300g frozen blueberries, 85g sugar syrup (or agave), 1.5g xanthan gum, a pinch of salt"
  - "For the blue icing: 3 egg whites, 4 cups (480g) icing sugar, ½ tbsp butterfly pea flower powder, 15 dried butterfly pea flowers steeped in ¼ cup water"
steps:
  - "The night before: make the custard by whisking all ingredients together in a saucepan over medium heat until thickened, then strain into a dish and bake at 230°C for 15–20 minutes until set with a few dark patches. Blend smooth and refrigerate."
  - "Blend the frozen blueberries with the sugar syrup and xanthan gum until smooth, then freeze in a shallow container, breaking up the ice crystals with a fork every hour or two (or churn in an ice cream maker if you have one)."
  - "For the cake: whisk together the flour, baking soda and salt. In a separate bowl, whisk the yogurt, milk, lemon zest and juice. Beat the chilled butter until smooth, then beat in the sugar until light and fluffy, then the eggs one at a time. Alternate folding in the flour mixture and yogurt mixture in three additions, then fold in the poppy seeds."
  - "Bake in a greased bundt tin at 180°C for 35–40 minutes, until a skewer comes out clean. While it bakes, simmer the lemon juice and sugar for the soaking syrup until dissolved. Brush the warm cake generously with the syrup once out of the oven and cooled for 10 minutes, then unmould."
  - "For the icing: whisk the egg whites until frothy, then gradually beat in the icing sugar until thick, glossy peaks form. Thin with the butterfly pea flower water a few drops at a time until it coats the back of a spoon, then mix in the pea flower powder until evenly blue. Drizzle over the cooled cake."
  - "Serve slices of the cake with a scoop of blueberry sorbet and a spoonful of the baked custard."
notes: Butterfly pea flower powder is what gives the icing its blue colour without artificial dye — look for it at specialty tea or baking shops.
