title: Ginger Cardamom Sour
description: >
  A spiced whiskey sour with a ginger-cardamom syrup — a good match for
  anything with warm, earthy spice on the menu.
servings: 1
prepTime: 5 min
difficulty: easy
tags: [cocktail, vegetarian-option]
ingredients:
  - 50ml whiskey or bourbon
  - 20ml fresh lemon juice
  - 20ml ginger-cardamom syrup (see notes)
  - 1 egg white (optional, for texture)
  - Ice
  - Lemon twist or candied ginger, to garnish
steps:
  - Add the whiskey, lemon juice, syrup, and egg white (if using) to a shaker without ice and shake hard for 15 seconds (a "dry shake") to emulsify.
  - Add ice and shake again until well chilled.
  - Double strain into a chilled coupe glass.
  - Garnish with a lemon twist or a sliver of candied ginger.
notes: >
  For the syrup: simmer equal parts sugar and water with a thumb of sliced
  ginger and 6 crushed cardamom pods for 10 minutes, then strain and cool.
