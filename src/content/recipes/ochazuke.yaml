title: Ochazuke with Green Tea Dashi
dinner: 2023-11-25-tea-tasting
description: >
  The second course of the Tea Tasting dinner, paired with an aracha tea —
  crisp yaki onigiri and puffed rice (genmai) in a green tea dashi, with
  salted mackerel.
servings: 6
prepTime: 1 hour
cookTime: 40 min
difficulty: medium
tags: [starter, japanese]
ingredients:
  - A strong pot of brewed aracha (or other green) tea
  - 1 piece kombu
  - A handful of katsuobushi (bonito flakes), optional
  - 2 tbsp mirin
  - 2 tbsp rice wine
  - 300g sushi rice, cooked (some reserved for the genmai)
  - Rice vinegar and sugar, for seasoning the onigiri rice
  - Soy sauce and sesame oil, for glazing
  - Furikake, sliced scallions and white sesame, to garnish
  - 200g salted mackerel or herring (no vinegar or oil)
  - Lime zest and neutral oil, for an optional aromatic oil
steps:
  - Brew a pot of green tea, slightly stronger than you'd drink it.
  - Soak the kombu in the warm tea for 1–2 hours to make a dashi base. Reheat gently, add the katsuobushi and steep for 3–5 minutes, then stir in the mirin and rice wine.
  - Cook the sushi rice, setting some aside to make the genmai (puffed rice).
  - "For the yaki onigiri: mix the rice with a little rice vinegar and sugar, shape into triangles, glaze with soy sauce and sesame oil, and pan-fry on one or two sides until golden."
  - "For the genmai: cook the reserved rice with extra water until slightly overcooked, spread on a tray and dry in the oven at 50°C for about 2 hours, then roast in a dry pan over medium-low heat until golden and puffed. Add to the dashi just before serving."
  - "Optional: warm a neutral oil gently with lime zest to make an aromatic drizzling oil."
  - Assemble in a bowl with the fried side of the onigiri facing up, top with furikake and scallions, and place two small slices of salted mackerel alongside. Pour the hot dashi in from the side at the table, and finish with the lime oil if using.
