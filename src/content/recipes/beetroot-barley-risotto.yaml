title: Beetroot Barley Risotto with Carrot Mosaic & Ajo Blanco
dinner: 2025-03-29-rgb-tasting-colors
description: >
  The "red" course of the RGB dinner — a beetroot and barley risotto
  topped with a rolled carrot mosaic and a chilled almond ajo blanco sauce.
  Scaled down and adapted from the original event menu (which fed 36 and
  offered a cured-fish version of the mosaic alongside the carrot one).
servings: 6
prepTime: 1 hour
cookTime: 1.5 hours
difficulty: hard
tags: [starter, vegan-option, gluten-free-option]
ingredients:
  - "For the broth: 3 carrots, 1 leek, 1 onion, 1 star anise, 1 cinnamon stick, 1 tsp whole black pepper, 6 bay leaves, salt, 1L water"
  - "For the barley: 2 tbsp olive oil, 1 onion (diced), 150g tomato paste, 75ml white wine, 2 large beetroot, 1 apple (diced), 270g rolled barley, 75g grated parmesan (omit for vegan)"
  - "For the carrot mosaic: 1.2kg red and purple carrots, dried parsley, olive oil, salt"
  - "For the ajo blanco: 4 cloves garlic, 150ml olive oil (for confit + sauce), 200g unblanched almonds, 50ml white dry vermouth, a pinch of sugar, salt, water"
steps:
  - "Broth: roast the carrots, leek and onion under a hot broiler until charred, then simmer with the star anise, cinnamon, pepper, bay leaves and water for 30–45 minutes. Strain and reserve."
  - "Confit the garlic in olive oil over the lowest heat for 2 hours (or until soft enough to mash)."
  - "Roast the beetroot wrapped in foil at 220°C for 50–60 minutes, then peel. Purée two thirds with a little water; finely dice the rest."
  - "Barley: sauté the diced onion in olive oil, stir in tomato paste until it darkens, then add the apple, beetroot purée and diced beetroot, and the barley. Gradually add the reserved broth, stirring often, until the barley is tender (about 30–40 minutes). Finish with the parmesan."
  - "Carrot mosaic: peel the carrots, toss with olive oil and salt, wrap tightly in foil and bake at 180°C for 50 minutes until steamed through. Cool slightly, coat lightly in dried parsley, then lay the carrots side by side on a sheet of plastic wrap and roll tightly into a log. Chill for at least 2 hours until set, then slice into rounds."
  - "Ajo blanco: boil the almonds for 10 minutes, drain, and peel off the skins. Blend with the confit garlic, garlic oil, vermouth, a little sugar and water until completely smooth. Pass through a fine sieve, then gently heat, stirring, until slightly thickened. Season with salt and thin with water to a pourable consistency. Chill."
  - "To serve: spoon the warm barley risotto into a ring mould in the centre of the plate, top with a slice of carrot mosaic, and surround with the ajo blanco sauce."
notes: >
  The original also cured strips of halibut in a beetroot-juice brine and
  sous-vide as an alternative "mosaic" — a striking effect, but involved
  enough (vacuum sealing, precise sous-vide timing) that the carrot version
  above is the more approachable route for a home kitchen.
