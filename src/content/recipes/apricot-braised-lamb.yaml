title: Apricot Braised Lamb with Persian Rice
dinner: 2026-05-09-silk-road-tastes-and-tales
description: >
  The main course from Silk Road: Tastes and Tales — lamb shank slow
  braised with dried apricots and warm spices, served over tahdig-style
  Persian rice with a saffron-barberry topping. The menu also served a
  vegetarian version with oyster mushrooms in place of the lamb.
servings: 4
prepTime: 1 hour (plus marinating)
cookTime: 8-12 hours
difficulty: hard
tags: [mains, persian, gluten-free-option]
ingredients:
  - "For the lamb: 800g lamb shank, ½ onion (grated, juice reserved), salt, 400g dried apricots, 4g toasted ground cumin, 1.5g toasted ground coriander, 1 tsp sumac, 4 whole garlic cloves, 200ml white wine, 1 beef stock cube, 2 bay leaves"
  - "For the spice sachet: 5 green cardamom pods, 1 clove, 1 cinnamon stick, 1 star anise, 2 rose buds"
  - "Jaggery, to taste, if the braise needs more sweetness"
  - "For the onion & fruit mixture: 4 large onions, 20g barberries, 1 carrot (julienned), 100g slivered almonds, ghee, salt"
  - "For the rice: 4 cups long-grain rice (washed very well), a few strips of lemon rind, salt, a pinch of MSG (optional), ½ vegetable stock cube"
  - "For the saffron-barberry topping: 20 strands saffron (bloomed in warm water), 1 tbsp rose water (optional), a pinch of sumac"
steps:
  - "Marinate the lamb in the grated onion juice and salt for at least an hour, ideally overnight. Reserve the onion."
  - "Sear the lamb well on all sides in a hot, oiled pot, then set aside. Cook the reserved onion briefly, add the ground cumin and coriander with the dried apricots, and let them bloom for a minute. Deglaze with the white wine, then add the whole garlic cloves."
  - "Return the lamb to the pot. Add the spice sachet (cardamom, clove, cinnamon, star anise, rose buds tied in cheesecloth), the beef stock, sumac and bay leaves. Cover with a cartouche and braise in the oven at 120°C for about 12 hours (or 150°C for 4 hours if short on time) — check occasionally and remove the spice sachet once the flavour feels balanced. Taste halfway through and add jaggery if it needs more sweetness."
  - "Once the meat pulls easily from the bone, remove the bone and cut the lamb into generous chunks."
  - "Onion & fruit mixture: caramelise the onions slowly in ghee, then add the barberries, julienned carrot and salt, cover and cook gently until sweet and soft. Fry the almonds separately in oil until crisp and golden — keep them separate so they stay crunchy."
  - "Rice: wash the rice until the water runs clear, then dry-toast it with the lemon rind in a pan until lightly golden. Parboil until about half-cooked, then steam over low heat with a little ghee, salt and vegetable stock until tender with a crisp bottom layer (tahdig)."
  - "Bloom the saffron in warm water, then combine with a little sumac and rose water, if using."
  - "To serve: turn the rice out onto a platter, spoon the onion and fruit mixture over, drizzle with the saffron topping, and scatter with the fried almonds and chopped parsley. Arrange the lamb over and around the rice."
notes: >
  Vegetarian version: replace the lamb with 500g oyster mushrooms, seared
  and braised the same way (needs less time — closer to 30–40 minutes).
