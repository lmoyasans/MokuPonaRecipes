title: Burmese Tacos with Tea Leaf Salad
dinner: 2025-03-29-rgb-tasting-colors
description: >
  The "green" course of the RGB dinner — corn tortillas filled with laab
  (or roasted sunchokes for a vegetarian version), fermented tea leaf
  salad, pickled green mango, and a green chili paste sauce.
servings: 6
prepTime: 1.5 hours (plus overnight fermenting of the tea leaves)
cookTime: 30 min
difficulty: hard
tags: [mains, vegetarian-option, burmese, hands-on]
ingredients:
  - "12 small white corn tortillas"
  - "For the laab (or swap for roasted sunchokes, below): 500g ground pork, 3 tbsp white jasmine rice (toasted and ground), 6 tbsp sliced shallot, ½ cup mint leaves, 4 tbsp chopped cilantro, 2 chopped green onions, 4 tbsp lime juice, chili flakes to taste, salt"
  - "Roasted sunchokes (vegetarian option): 500g sunchokes, 3 tbsp toasted rice powder (as above), chili flakes, lime juice, olive oil"
  - "For the fermented tea leaf salad: 1 cup dried green tea leaves, ½ cup chopped cilantro, ½ cup chopped green onion, 2 tbsp chopped ginger, 1 tbsp garlic paste, juice of 1 lime, salt"
  - "For the green chili paste sauce: 2 tsp coriander seeds, 1 tsp cumin seeds, 30g green chilies, 3 tbsp sliced lemongrass, 1.5 tbsp chopped galangal, zest of half a lime, 3 tbsp shallot, 2 tbsp garlic, 2 egg yolks, 150ml neutral oil"
  - "For the pickled green mango: 1 green mango (julienned), juice of 1 lime, 2 tbsp sugar"
  - "To serve: chopped peanuts, lime wedges, banana leaf or plates for plating"
steps:
  - "Start the tea leaf salad the day before: soak the dried tea leaves in hot water for 10 minutes, drain, and mash briefly in lukewarm water to soften. Soak in cold water for at least an hour to reduce bitterness, then chop finely and mix with the cilantro, green onion, ginger, garlic paste, lime juice and salt. Cover and leave to ferment in a cool, dark spot for a day (or up to two)."
  - "For the laab: toast the rice in a dry pan until deep brown, then grind to a coarse powder. Cook the pork in a little water until just done, then off the heat stir through the shallot, toasted rice powder, lime juice and chili flakes. Finish with the herbs."
  - "For the sunchokes: boil for 5–6 minutes, drain, toss in olive oil and roast at 200°C for 10–12 minutes until golden. Toss with rice powder, chili flakes and lime juice."
  - "For the green chili paste: toast and grind the coriander and cumin seeds. Pound the chilies and salt to a paste in a mortar, then work in the toasted spices, lemongrass, galangal, lime zest, shallot and garlic. Blend with the egg yolks and oil until emulsified into a smooth sauce."
  - "Pickle the mango: toss the julienned mango with lime juice and sugar, and let sit for 20–30 minutes."
  - "Warm the tortillas. Fill with laab or roasted sunchokes, top with the tea leaf salad, pickled mango and peanuts, and finish with the green chili sauce."
notes: The original served three tacos per person — vegetarians got three of the sunchoke version, everyone else two meat and one veg.
