title: Smoky Lentil Stew
description: A thick, smoky stew that tastes even better the next day.
servings: 6
prepTime: 15 min
cookTime: 45 min
difficulty: easy
tags: [stew, vegan, mains, gluten-free]
ingredients:
  - 400g brown or green lentils
  - 1 onion, diced
  - 2 carrots, diced
  - 2 celery stalks, diced
  - 3 cloves garlic, minced
  - 1 tin chopped tomatoes
  - 1 tsp smoked paprika
  - 1 L vegetable stock
  - Olive oil, salt, pepper
steps:
  - Sauté the onion, carrots, and celery in olive oil until soft, about 8 minutes.
  - Add the garlic and smoked paprika, cook for 1 minute.
  - Add the lentils, tomatoes, and stock. Bring to a boil, then simmer for 35-40 minutes until the lentils are tender.
  - Season to taste and serve with crusty bread.
