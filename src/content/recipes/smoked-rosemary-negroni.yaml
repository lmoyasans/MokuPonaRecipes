title: Smoked Rosemary Negroni
description: >
  A classic negroni finished with a rosemary smoke — a good opener for an
  earthy, savory-leaning menu.
servings: 1
prepTime: 5 min
difficulty: medium
tags: [cocktail, gluten-free]
ingredients:
  - 30ml gin
  - 30ml sweet vermouth
  - 30ml Campari
  - 1 sprig fresh rosemary
  - Ice
  - Orange peel, to garnish
steps:
  - Stir the gin, vermouth, and Campari with ice in a mixing glass until well chilled.
  - Strain over a large ice cube in a rocks glass.
  - Briefly torch the rosemary sprig until it smokes, then cap the glass with an inverted bowl to trap the smoke for 30 seconds.
  - Remove the bowl, express an orange peel over the drink, and garnish with the rosemary.
notes: No kitchen torch? Skip the smoking step — it's still a very good negroni without it.
