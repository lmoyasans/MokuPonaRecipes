title: Koji-Marinated Beef Stew with Mushroom Medley
dinner: 2025-09-06-earth-beneath-us
description: >
  The main course from The Earth Beneath Us — a long-braised, shio-koji
  marinated beef stew over potato purée with a pistachio-pea crumble and
  a mix of pickled and roasted mushrooms. A koji-marinated hasselback
  beet stands in for the beef in the vegetarian version.
servings: 6
prepTime: 1 hour (plus overnight marinating)
cookTime: 6 hours
difficulty: hard
tags: [mains, vegetarian-option]
ingredients:
  - "For the beef: 1.2kg beef chuck or brisket, 60g shio koji, 400g grated onion, 2 garlic cloves (smashed), 1 tbsp mashed fermented black beans, 15g molasses, 40ml rice vinegar, 30g tomato paste, 2 carrots (sliced), 1 dried shiitake mushroom, ½ cinnamon stick, ½ star anise, 1 cardamom pod, 90g miso paste, neutral oil"
  - "For the vegetarian hasselback beets: 6 medium beets, 90g shio koji, juice and zest of 1 lime, olive oil, black pepper"
  - "For the mushroom medley: 200g oyster mushrooms, 2 packs (200g) shimeji mushrooms, 2 packs (200g) enoki mushrooms; pickling brine of 50g sugar, 300ml water, 150ml rice vinegar, ginger, chili, Sichuan peppercorns, star anise; cornstarch and Chinese five-spice for the enoki"
  - "For the potato purée: 1.5kg waxy potatoes, 1L cream, 60g butter, fleur de sel"
  - "For the pea crumble: 150g peas, 30g pistachios, 15g parmesan"
steps:
  - "Beef: blend the shio koji to a paste, coat the beef, and refrigerate overnight. Sear the marinated beef well on all sides in oil, then set aside. In the same pot, caramelise the grated onion and garlic, stir in tomato paste, then the molasses, fermented black beans and miso. Return the beef to the pot with the carrots, shiitake, and the cinnamon/star anise/cardamom tied in a cheesecloth. Cover with water, bring to a simmer, and braise very gently (covered) for at least 6 hours until the beef is falling-apart tender. Remove the spice bag an hour before serving."
  - "Vegetarian version: blend the shio koji to a paste and coat the scrubbed beets. Marinate 12–24 hours, then roast wrapped in foil at 200°C for about an hour until a knife slides in easily. Peel while warm, hasselback-slice, brush with oil, and roast again at 220°C for 25–30 minutes until crisp-edged. Finish with a lime, oil and pepper vinaigrette."
  - "Mushroom medley: simmer the pickling brine ingredients, cool slightly, and pour over the shimeji clusters — leave to pickle for a few hours. Toss the enoki in cornstarch and five-spice and pan-fry until crisp. Roast the oyster mushrooms with oil and salt at 200°C for 10 minutes until golden."
  - "Potato purée: simmer the peeled potatoes until tender, reduce the cream by about a third, brown the butter separately. Pass the potatoes through a ricer or fine sieve, fold in the reduced cream and browned butter, and season with fleur de sel."
  - "Pea crumble: blanch the peas, dry them on a tray in a low oven, then mix with finely chopped pistachios and parmesan and bake until lightly crisp."
  - "Plate the beef or beets over the potato purée, scatter with the mushroom medley, and finish with the pea crumble."
notes: This scales down well — the original braised a 4kg cut of beef for the full dinner.
