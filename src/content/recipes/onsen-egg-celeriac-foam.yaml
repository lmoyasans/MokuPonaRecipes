title: Onsen Egg with Celeriac Foam
dinner: 2025-09-06-earth-beneath-us
description: >
  A starter from The Earth Beneath Us — a slow-cooked "onsen" egg under a
  miso-celeriac foam, with crisp celeriac chips and pickled mustard seeds.
  The original used a whipping siphon for the foam; a blender works too,
  just with a looser texture.
servings: 6
prepTime: 1 hour
cookTime: 1 hour
difficulty: hard
tags: [starter, vegetarian-option, gluten-free]
ingredients:
  - 6 medium eggs
  - "For the pickled mustard seeds: 50g yellow mustard seeds, 100ml rice vinegar, 50ml water, 50ml mirin, 5g fresh ginger, 1 star anise, 40g sugar, salt"
  - "For the celeriac foam: 1 celeriac root, 2 shallots, 2 garlic cloves, 30g butter, 1 tbsp mirin, 250ml full-fat cream, 1 tbsp rice vinegar, 400ml miso dashi (water simmered with a piece of kombu, 1 tbsp bonito flakes and 35g miso paste)"
  - "For the celeriac crisps: a 100g slice of celeriac, neutral oil, sea salt"
steps:
  - "Pickled mustard seeds: simmer all ingredients together for 45 minutes to 1 hour until the seeds have softened and plumped. Store in a sterilised jar."
  - "Onsen eggs: hold the eggs in a 63.5°C water bath for 45 minutes (a slow cooker or sous vide works well), then transfer to an ice bath until ready to serve."
  - "Celeriac crisps: slice celeriac very thinly on a mandoline, brush with oil, and bake at 150°C for about 40 minutes, flipping halfway, until crisp. Salt one side."
  - "Celeriac foam: make the miso dashi, then sauté the shallot and garlic in butter, add diced celeriac and cook a few minutes until caramelised. Add the miso dashi, simmer covered 15 minutes until the celeriac is soft, then blend with the cream and rice vinegar until velvety. Pass through a fine sieve and season."
  - "To serve, crack an onsen egg into each bowl, spoon the warm celeriac foam around it (don't pour it directly onto the egg or it'll break), and finish with celeriac crisps and a spoonful of pickled mustard seeds."
notes: >
  No siphon? Just whisk the finished celeriac purée hard with a hand
  blender to aerate it before spooning around the egg — less airy, but
  the flavour is the same.
