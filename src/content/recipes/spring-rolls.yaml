title: Fresh Vegetable Spring Rolls
description: >
  A build-your-own spring roll spread — great as a shared, hands-on starter
  that gets everyone at the table involved.
servings: 8
prepTime: 30 min
difficulty: easy
tags: [starter, vegan, vietnamese, hands-on]
ingredients:
  - 20 rice paper wrappers
  - 200g rice vermicelli noodles, cooked
  - 1 carrot, julienned
  - 1 cucumber, julienned
  - 1 red bell pepper, julienned
  - A handful of fresh mint and coriander
  - 100g roasted peanuts, crushed
  - Peanut dipping sauce
steps:
  - Lay out all the fillings on the table so everyone can build their own.
  - Dip a rice paper wrapper in warm water for a few seconds until pliable.
  - Layer noodles, vegetables, and herbs on the wrapper and roll tightly, folding in the sides.
  - Serve immediately with peanut dipping sauce.
notes: Keep a damp towel on the table — rice paper dries out fast once opened.
