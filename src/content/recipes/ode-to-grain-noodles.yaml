title: 'An Ode to Grain: Udon Noodles with Plum & Roasted Barley Sauce'
dinner: 2026-05-09-silk-road-tastes-and-tales
description: >
  The starter from Silk Road: Tastes and Tales — udon noodles in a plum
  and roasted barley tea sauce, with pickled fennel, sichuan pepper oil
  and puffed millet.
servings: 4
prepTime: 1 hour
cookTime: 30 min
difficulty: medium
tags: [starter, vegan, hands-on]
ingredients:
  - 4 portions udon noodles (fresh or dried)
  - "For the plum sauce: 300g plums (or plum jam), 100ml white wine, 1 onion (sliced), 100ml roasted barley tea (infused), 50ml green tea (infused), 1 piece long pepper, a few whole black peppercorns, a knob of ginger, salt, MSG (optional)"
  - "For the pickled fennel: 1 fennel bulb (mandolined), 100ml red or brown rice wine vinegar, 1 tsp coriander seeds, 1 tsp fennel seeds, salt"
  - "For the sichuan pepper oil: 100ml neutral oil, white parts of 2 scallions, a few slices of ginger, 1 tbsp red and green Sichuan peppercorns"
  - "For the puffed millet: 50g millet grains, oil for frying"
steps:
  - "Plum sauce: cook the plums down to a jam (add a splash of water if needed), then blend and strain to a purée. Simmer the wine with the onion until softened, remove the onion, then add the plum purée, barley tea and green tea. Add the ginger, long pepper and peppercorns tied in a spice bag, simmer 10 minutes, then remove the spices and reduce until thickened. Season with salt and a little MSG if using."
  - "Pickled fennel: combine all ingredients in a jar and let macerate at least 30 minutes."
  - "Sichuan pepper oil: heat the oil until hot, then pour it over the scallions, ginger and peppercorns in a heatproof bowl to infuse."
  - "Puffed millet: boil the millet until slightly overcooked, spread on a tray and dry in a low oven (50°C) until fully dry, then fry the dried kernels in hot oil until they puff up."
  - "Cook the udon according to the package, toss with the plum sauce, and top with pickled fennel, a drizzle of sichuan pepper oil and a scattering of puffed millet."
