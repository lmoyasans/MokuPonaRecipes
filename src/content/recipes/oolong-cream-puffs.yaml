title: Cream Puffs with Milky Oolong Cream (Gluten-Free)
dinner: 2023-11-25-tea-tasting
description: >
  The dessert course of the Tea Tasting dinner, paired with a milky
  oolong — gluten-free choux buns with an oolong pastry cream and an
  oolong craquelin topping.
servings: 6
prepTime: 1.5 hours
cookTime: 30 min
difficulty: hard
tags: [dessert, gluten-free]
ingredients:
  - "For the pastry cream: 50g sugar, 20g cornstarch, 2 egg yolks, a pinch of salt, 250g whole milk, 10g milky oolong tea leaves, 15g butter, 150g heavy cream"
  - "For the craquelin: 30g butter (room temperature), 35g flour, 35g dark brown sugar, 4g powdered oolong tea"
  - "For the gluten-free choux: 40g milk, 40g water, 35g butter, a pinch of salt, 5g sugar, 50g gluten-free all-purpose flour blend, 2 eggs (lightly beaten)"
  - Powdered sugar, for dusting
steps:
  - "Pastry cream: warm the milk with the oolong tea leaves and let steep for 10 minutes, then strain. Whisk the sugar and cornstarch with the egg yolks and salt. Reheat the strained milk until just simmering, then whisk half of it into the yolk mixture to temper. Return everything to the pan and whisk constantly over medium heat until very thick. Off the heat, whisk in the butter, then press plastic wrap onto the surface and chill until cold."
  - "Craquelin: combine the butter, flour, brown sugar and powdered oolong into a smooth paste. Roll between two sheets of parchment to about 2mm thick and freeze until firm."
  - "Choux: combine the milk, water, butter, salt and sugar in a pan and bring to a boil. Add the flour all at once and stir vigorously to form a thick paste. Cook for 1–2 minutes to dry it out, then transfer to a bowl and beat in the eggs a little at a time until glossy and it falls in a 'V' from the spoon."
  - Pipe or spoon the choux into 12 small mounds on a lined baking tray. Cut circles of the frozen craquelin and place one on top of each mound.
  - Bake at 200°C for 15 minutes, then reduce to 180°C and bake for a further 15–20 minutes until deeply golden. Poke a small vent in the side of each puff and cool completely on a rack.
  - Whip the chilled cream to stiff peaks and fold in the oolong pastry cream. Fill a piping bag and pipe into each puff through a small hole in the base.
  - Dust with powdered sugar and serve.
