title: Rabri Crème Brûlée with Indonesian Flavours
dinner: 2025-09-06-earth-beneath-us
description: >
  The dessert from The Earth Beneath Us — a slow-reduced, pandan-scented
  rabri (Indian reduced-milk pudding) finished crème-brûlée style, with
  pistachios and banana.
servings: 6
prepTime: 20 min (plus overnight chilling)
cookTime: 1.5 hours
difficulty: medium
tags: [dessert, gluten-free, indian]
ingredients:
  - 2L whole milk (or 1 x 400ml can coconut milk for a vegan version)
  - 2 pandan leaves
  - Palm sugar, to taste (about 100g)
  - Sugar, for the brûlée top
  - 50g pistachios
  - 2 bananas
steps:
  - Simmer the milk gently, stirring often to prevent a skin forming and scraping the bottom to avoid burning, until reduced to about a third of its original volume. This takes a while — don't rush it.
  - Meanwhile, blend the pandan leaves with a little water, then strain and keep the juice.
  - Once the milk has reduced, grate in palm sugar to taste, let it cool slightly, then stir in the pandan juice. Chill overnight.
  - Before serving, divide into bowls, sprinkle with sugar, and torch until the sugar caramelises into a brittle top.
  - Coarsely crush the pistachios and scatter on top, along with a few slices of banana.
notes: Homemade ceramic bowls were used for the original serving — any small, wide bowls work well here.
