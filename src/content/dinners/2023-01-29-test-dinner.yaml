title: Test Dinner
date: 2023-01-29
theme: The first winter series dinner, opened with a tea ceremony and a round of questions about food and home.
description: >
  One of moku pona's earliest dinners, before there was a website or a
  regular schedule — just a small group cooking together and figuring out
  what this could become. The evening opened with a tea ceremony and a
  discussion built around a simple prompt: what food reminds you of home?
