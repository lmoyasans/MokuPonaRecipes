title: Alpine Dinner
date: 2023-10-29
theme: A mountain-cuisine menu of sorrel dumplings, pumpkin raviolo, venison stew, and chestnut dessert.
description: >
  A cold-weather menu built around Alpine staples — sour sorrel dumplings,
  handmade pasta filled with pumpkin, a venison pfeffer stew, and a
  chestnut-and-honey-pear dessert to finish.
