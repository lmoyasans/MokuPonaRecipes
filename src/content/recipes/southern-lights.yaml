title: Southern Lights
dinner: 2025-03-29-rgb-tasting-colors
description: >
  The "cyan/magenta" drink from the RGB dinner — a butterfly-pea-flower
  blue gin with basil-lemongrass syrup, turning shades of purple as the
  lime is stirred in table-side.
servings: 1
prepTime: 10 min (plus infusing the gin ahead of time)
difficulty: medium
tags: [cocktail]
ingredients:
  - 60ml blue gin (dry gin infused for a few hours with 3-4 tbsp dried butterfly pea flowers, then strained)
  - 30ml basil-lemongrass syrup (1 cup sugar simmered with 1.5 cups Thai basil and 2 tbsp sliced lemongrass in 2 cups water, then strained)
  - 30ml fresh lime juice, added at the table
steps:
  - Combine the blue gin and basil-lemongrass syrup in a glass over ice.
  - Serve with the lime juice on the side (in a small pitcher or teapot) to pour in at the table — the drink shifts from blue to purple as the acid hits it.
notes: >
  Non-alcoholic version: mix 45ml of the basil-lemongrass syrup with 100ml
  soda water instead of the gin.
