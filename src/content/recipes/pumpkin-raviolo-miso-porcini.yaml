title: Pumpkin Raviolo with Miso Porcini Sauce
dinner: 2023-10-29-alpine-dinner
description: >
  The vegetarian starter from the Alpine Dinner — handmade pumpkin
  ravioli in a miso and porcini sauce.
servings: 6
prepTime: 1.5 hours
cookTime: 20 min
difficulty: hard
tags: [starter, vegetarian, hands-on]
ingredients:
  - "For the pasta: 400g 00 flour, 4 eggs, 2 egg yolks, 2 tbsp olive oil, a pinch of salt"
  - "For the filling: 800g pumpkin (roasted), 3 egg yolks, a handful of fresh parsley, salt, a pinch of nutmeg"
  - "For the sauce: 400g porcini mushrooms (Steinpilze), 3 tbsp miso paste, fresh thyme, 120ml olive oil"
steps:
  - Roast the pumpkin until soft, then mash and let cool. Mix with the egg yolks, chopped parsley, salt and nutmeg to make the filling.
  - "Make the pasta dough: mound the flour, make a well in the centre, and add the eggs, yolks, oil and salt. Work into a smooth dough, then wrap and rest for 30 minutes."
  - Roll the dough thin, spoon small mounds of filling at intervals, fold over and seal, then cut into individual ravioli.
  - For the sauce, sauté the porcini in the olive oil with thyme until golden. Whisk in the miso paste, loosened with a splash of the pasta cooking water, and simmer briefly.
  - Boil the ravioli until they float, then toss gently in the miso porcini sauce.
