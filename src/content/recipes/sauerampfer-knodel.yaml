title: Sauerämpfer Knödel with Conserved Chanterelles & Gooseberry Jam
dinner: 2023-10-29-alpine-dinner
description: >
  Bread dumplings folded with cooked-down sorrel, served with chanterelles
  and gooseberry jam. Ingredients are from the original Alpine Dinner
  menu; the method is standard bread-dumpling technique, since the
  original notes on method were incomplete.
servings: 6
prepTime: 45 min
cookTime: 20 min
difficulty: medium
tags: [starter, vegetarian, austrian]
ingredients:
  - 2 large loaves stale bread (2 days old), cubed
  - 1-2 eggs
  - 1 onion, grated
  - 300g sorrel (about 1.5 jars)
  - 60ml milk
  - 100ml buttermilk
  - Flour, as needed
  - Caraway seeds, paprika, salt, pepper, nutmeg
  - "To serve: conserved chanterelles, gooseberry jam, 300ml yogurt, a little grated garlic"
steps:
  - Cook the sorrel in a dry pan (no oil) over medium heat until all its moisture has cooked off.
  - Soak the bread cubes in the warmed milk and buttermilk until softened.
  - Mix in the grated onion, egg, cooked sorrel, caraway, paprika, salt, pepper and a little nutmeg. If the mixture is too wet to hold together, work in a little flour.
  - Shape into dumplings and poach in gently simmering salted water for 15–20 minutes, until they float and are cooked through.
  - Serve with conserved chanterelles, a spoonful of gooseberry jam, a dollop of yogurt and a little grated garlic.
