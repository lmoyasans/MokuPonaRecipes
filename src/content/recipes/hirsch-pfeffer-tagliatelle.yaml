title: Hirsch Pfeffer with Fresh Tagliatelle
dinner: 2023-10-29-alpine-dinner
description: >
  The meat starter from the Alpine Dinner — a red wine braised venison
  stew over handmade tagliatelle, finished with sautéed apple and sage.
servings: 6
prepTime: 1.5 hours (plus marinating)
cookTime: 2.5 hours
difficulty: hard
tags: [mains, austrian, hands-on]
ingredients:
  - "For the pasta: 400g 00 flour, 4 eggs, 2 egg yolks, 2 tbsp olive oil, a pinch of salt"
  - "For the stew: 800g venison (diced), 600ml red wine, 1 stalk celery, 2 carrots, 1 onion, 1 bay leaf, 3 tbsp tomato purée, 40g butter"
  - "For the apple garnish: 4 apples (sliced), apple cider vinegar, sugar, fresh sage"
steps:
  - Marinate the venison in the red wine with the celery, carrots, onion and bay leaf, ideally overnight (at least a few hours).
  - Remove the venison, pat dry, and brown well in the butter in a heavy pot. Add the marinated vegetables and cook until softened, then stir in the tomato purée and pour the marinade wine back in.
  - Cover and simmer gently for 2–3 hours, until the venison is very tender. Adjust the seasoning.
  - "Make the pasta dough: mound the flour, make a well, add the eggs, yolks, oil and salt, and knead into a smooth dough. Rest, wrapped, for 30 minutes, then roll thin and cut into ribbons."
  - Cook the tagliatelle in boiling salted water for 2–3 minutes.
  - For the garnish, sauté the sliced apples in a little butter with a splash of cider vinegar and a pinch of sugar until just softened, then finish with torn sage.
  - Serve the venison stew over the tagliatelle, topped with the sautéed apple.
