title: The Earth Beneath Us
date: 2025-09-06
theme: A three-course dinner digging into what the earth provides — mushrooms, roots, and minerals.
description: >
  Earthy interpretations of Chinese and Japanese dishes opened the evening,
  followed by a main course that broke free from borders entirely, and a
  dessert that turned to India and Southeast Asia for brightness and depth.
  Served with a complementary cocktail and a hand-made surprise gift.
