title: Gold Rush (Turmeric)
dinner: 2025-03-29-rgb-tasting-colors
description: The "yellow" drink from the RGB dinner — a turmeric and ginger beer highball.
servings: 1
prepTime: 5 min
difficulty: easy
tags: [cocktail, mocktail, vegan]
ingredients:
  - 45ml turmeric infusion water (turmeric steeped in warm water, strained)
  - 15ml lemon juice
  - 100ml ginger beer
  - 1 piece candied ginger, to garnish
steps:
  - Combine the turmeric infusion and lemon juice in a glass over ice.
  - Top with ginger beer and stir gently.
  - Garnish with a piece of candied ginger.
notes: Naturally alcohol-free — add a shot of vodka or gin if you want it stronger.
