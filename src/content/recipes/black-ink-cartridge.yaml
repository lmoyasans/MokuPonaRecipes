title: Black Ink Cartridge
dinner: 2025-03-29-rgb-tasting-colors
description: >
  The "black" drink from the RGB dinner — a smoky mezcal cocktail turned
  jet black with activated charcoal.
servings: 1
prepTime: 5 min
difficulty: easy
tags: [cocktail, gluten-free]
ingredients:
  - 60ml smoky mezcal
  - 15ml lime juice
  - 15ml agave syrup
  - 45ml blood orange juice
  - 1 activated charcoal capsule
steps:
  - Mix the activated charcoal into the mezcal until fully dissolved.
  - Combine with the lime juice, agave syrup and blood orange juice in a shaker with ice, and stir well.
  - Strain into a glass and serve.
notes: Stir the charcoal-mezcal mix once more just before combining — the charcoal settles fast.
