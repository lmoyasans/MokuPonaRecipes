title: 'Silk Road: Tastes and Tales'
date: 2026-05-09
theme: A four-course menu inspired by the historic trade routes between Central Asia and Europe.
description: >
  Dedicated to the tastes and tales of the Silk Roads — the paths that carried
  not just textiles, fruit, and spice, but stories and traditions across
  continents. Run in partnership with Zurich Storytellers, who guided the
  evening's narratives alongside the four-course menu and drinks.
