title: Tea Leaf Salsa on Roasted Pumpkin
dinner: 2023-11-25-tea-tasting
description: >
  The third course of the Tea Tasting dinner, paired with a Georgian wild
  tea — roasted butternut squash in lettuce cups with a fermented
  gunpowder green tea salsa.
servings: 6
prepTime: 20 min (plus 2 days fermenting)
cookTime: 30 min
difficulty: medium
tags: [starter, vegan, gluten-free]
ingredients:
  - "For the tea leaf paste: ¾ cup dried gunpowder green tea leaves, 1 cup safflower or canola oil, 2 bulbs garlic (chopped), 6 tbsp minced ginger, 6 tbsp lime juice, 1 tsp red pepper flakes, salt"
  - 1 large butternut squash
  - Olive oil
  - Roasted peanuts, lettuce leaves, lime wedges and fresh coriander, to serve
steps:
  - Pour hot water over the tea leaves and let them soak for at least an hour, until soft, picking out any twigs or hard stems, then drain.
  - Rinse the leaves and cover with water again; soak overnight to mellow the bitterness.
  - Drain and squeeze out the excess liquid, then blend the leaves with the oil, garlic, ginger, lime juice, salt and chili flakes into a paste. Transfer to a jar and refrigerate for at least 2 days before using.
  - Roast the butternut squash with olive oil at 200°C until tender, then cut into bite-sized pieces.
  - To serve, place a lettuce leaf on each plate, add a piece of roasted squash, and top generously with the tea leaf salsa. Garnish with coriander and roasted peanuts, and serve with lime wedges.
