title: Shikanji
dinner: 2025-09-06-earth-beneath-us
description: >
  The apéro drink from The Earth Beneath Us — a spiced, salted Indian
  lemonade.
servings: 1
prepTime: 5 min
difficulty: easy
tags: [mocktail, vegan, gluten-free]
ingredients:
  - Sugar, to taste
  - Water
  - Juice of 1 lemon
  - A pinch of black salt
  - Freshly ground black pepper
  - Freshly ground cumin
  - Soda water, to top up
  - Ice
  - Mint leaves, to garnish
steps:
  - Dissolve the sugar in a little water in the bottom of a glass.
  - Add the lemon juice, black salt, a pinch of pepper and cumin, and stir to combine, tasting and adjusting the balance of sweet, salty and spiced.
  - Fill the glass with ice and top up with soda water.
  - Garnish with mint leaves.
