title: Smokey Naked and Famous
dinner: 2023-11-25-tea-tasting
description: >
  The closing cocktail of the Tea Tasting dinner, paired with a Malawi
  smoked black tea — an equal-parts riff on the Naked and Famous, made
  with smoked-tea-infused vodka.
servings: 1
prepTime: 5 min (plus infusing the vodka ahead of time)
difficulty: easy
tags: [cocktail]
ingredients:
  - 22ml smoked tea-infused vodka (steep vodka with Malawi smoked black tea leaves for a few hours, then strain)
  - 22ml Aperol
  - 22ml yellow Chartreuse
  - 22ml fresh lime juice
steps:
  - Combine all ingredients in a shaker with ice.
  - Shake well and double strain into a chilled coupe glass.
