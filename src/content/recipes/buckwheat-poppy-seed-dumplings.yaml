title: Buckwheat & Poppy Seed Dumplings with Vanilla Sour Cream Sauce
dinner: 2023-01-29-test-dinner
description: >
  Sweet dumplings filled with buckwheat, poppy seeds and lemon zest,
  served in a warm vanilla sour cream sauce. Transcribed from the
  original handwritten recipe notes.
servings: 8
prepTime: 1 hour
cookTime: 30 min
difficulty: medium
tags: [dessert, vegetarian]
ingredients:
  - "For the dough: 150g flour, ½ tsp baking soda, ½ tsp baking powder, ½ tsp salt, 100g sour cream, 1 egg"
  - "For the filling: zest of 4 lemons, 100g buckwheat, 60g poppy seeds, 1 egg yolk, 50g butter (melted), 2 tbsp sugar"
  - "For the vanilla sauce: 50g butter, 500g sour cream, 50g flour, 50g sugar, seeds of 3 vanilla pods, 50ml milk, 4 egg yolks"
  - Lemon wedges, to serve
steps:
  - Boil the buckwheat and poppy seeds separately in slightly salted water, then drain and cool.
  - "Dough: mix the dry ingredients in a large bowl. Whisk the sour cream and egg together, then combine with the dry ingredients until just hydrated. Let rest for 10–15 minutes."
  - Knead the dough until springy, resting for 10–15 minutes between two more short kneads.
  - Mix the cooked buckwheat and poppy seeds with the sugar, melted butter, egg yolk and lemon zest to make the filling.
  - Roll out the dough, add spoonfuls of filling, and shape into dumplings.
  - "Vanilla sauce: melt the butter in a pan, whisk in the flour and toast briefly. Whisk in the milk and sour cream and the sugar, then add the vanilla seeds and pods and cook until well combined. Temper the egg yolks with a little of the hot liquid, then whisk back into the sauce. Cook over medium heat, stirring constantly, until thickened."
  - Boil the dumplings for about 2 minutes, until they float.
  - Serve the dumplings with the warm vanilla sauce and a lemon wedge.
