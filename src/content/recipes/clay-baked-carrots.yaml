title: Clay-Baked Carrots with Burnt Leek Ash
dinner: 2025-09-06-earth-beneath-us
description: >
  The amuse-bouche from The Earth Beneath Us — carrots wrapped in lotus
  leaf and baked inside a clay shell, served with a citrus mascarpone and
  a dusting of burnt leek ash.
servings: 6
prepTime: 45 min
cookTime: 2.5 hours
difficulty: hard
tags: [starter, vegetarian-option, gluten-free]
ingredients:
  - 1kg food-safe clay (or a salt-dough substitute)
  - 6 mixed carrots (a mix of colours if you can get them)
  - 80ml maple syrup, for glazing
  - 4 lotus leaves, soaked in warm water (banana leaf works as a substitute)
  - 2 leek sticks
  - 300g mascarpone (or vegan mascarpone)
  - 2 lemons (zest and juice)
  - Kala namak (black salt), or regular salt
steps:
  - "Leek ash: bake the separated, washed leek layers at 190°C for 30–40 minutes until black-brown and crispy, then grind to a powder."
  - "Mix the mascarpone with lemon zest, juice and a little maple syrup; keep chilled."
  - "Toss the peeled carrots with olive oil, a pinch of cayenne and plenty of salt."
  - "Roll out the clay to about 1cm thick. Wrap each carrot in soaked lotus leaf, then encase in clay, sealing well."
  - "Bake at 190°C for 2 hours. Crack open the clay shell and unwrap the carrots."
  - "To serve, brush each carrot with a little more maple syrup, plate with a spoonful of the citrus mascarpone, and dust with the leek ash."
notes: The clay is purely a cooking vessel — make sure it's food-safe, and don't eat it.
