title: Beetroot Gratin with Horseradish Béchamel & Brynza Meringue
dinner: 2023-01-29-test-dinner
description: >
  A layered beetroot and horseradish gratin with a savoury feta meringue
  and a spinach-mushroom broth. Transcribed from the original handwritten
  recipe notes.
servings: 6
prepTime: 45 min
cookTime: 40 min
difficulty: hard
tags: [starter, vegetarian, gluten-free-option]
ingredients:
  - "For the horseradish béchamel: 1 stalk fresh horseradish (grated), 100g butter, 100g flour, 500ml cream, 2 tsp mustard, black pepper, salt"
  - 2 raw beetroot (peeled, thinly sliced)
  - 150-200g feta, sliced
  - "For the spinach-mushroom broth: 10g dried mushrooms, boiling water, a handful of spinach, a bundle of dill, juice of ½ lemon, salt"
  - "For the brynza meringue: 200g brynza (or feta), 4 egg whites, ½ stalk horseradish (grated), 30g powdered sugar"
steps:
  - "Béchamel: grate the horseradish. Melt the butter in a pan, whisk in the flour and toast briefly, then whisk in the cream. Stir in the horseradish, mustard, salt and pepper to taste."
  - "Toss the sliced beetroot with half the béchamel, then layer in a baking dish. Top with a layer of feta."
  - "Bake at 200°C for about 35 minutes, or until the top is browned."
  - "Broth: steep the dried mushrooms in boiling water to make a mushroom tea. Strain, then blend with the spinach, dill and lemon juice. Pass through a sieve."
  - "Meringue: blend the grated horseradish with a splash of water and the brynza until smooth. Whisk the egg whites with the powdered sugar to stiff peaks, then fold in the cheese mixture. Make this shortly before serving."
  - "To serve, plate a slice of the gratin, pour the green broth around it, and finish with a few dollops of the meringue."
