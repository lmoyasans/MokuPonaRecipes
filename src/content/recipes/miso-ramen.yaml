title: Miso Ramen
description: >
  A warming bowl of miso ramen, built from a simple homemade broth. Easy to
  scale up for a crowd and easy to make vegetarian.
servings: 4
prepTime: 20 min
cookTime: 40 min
difficulty: medium
tags: [soup, japanese, vegetarian-option, mains]
ingredients:
  - 4 portions ramen noodles
  - 1.5 L vegetable or chicken stock
  - 3 tbsp miso paste
  - 2 cloves garlic, minced
  - 1 tbsp grated ginger
  - 2 spring onions, sliced
  - 1 soft-boiled egg per portion
  - 100g corn kernels
  - Chili oil, to taste
  - Nori sheets, to serve
steps:
  - Bring the stock to a gentle simmer with the garlic and ginger for 15 minutes.
  - Whisk the miso paste into a ladle of hot stock, then stir it back into the pot (don't boil after adding miso).
  - Cook the ramen noodles separately according to the package, then divide into bowls.
  - Ladle the hot broth over the noodles.
  - Top each bowl with a halved soft-boiled egg, corn, spring onions, nori, and a drizzle of chili oil.
notes: Swap the stock for a mushroom-based one to make it fully vegetarian.
