title: Marroni Biscotti with Ricotta & Honey-Poached Pear
dinner: 2023-10-29-alpine-dinner
description: The dessert from the Alpine Dinner — chestnut and ricotta biscotti with pine-scented honey-poached pear.
servings: 6
prepTime: 30 min
cookTime: 45 min
difficulty: medium
tags: [dessert, vegetarian]
ingredients:
  - 500g cooked chestnuts (marroni)
  - 100g butter
  - 200g ricotta
  - 100g semolina
  - 2 pears
  - 300ml white wine
  - 60g honey
  - A few pine needles (optional, for the poaching liquid)
  - Mint, to garnish
steps:
  - Poach the pears in the white wine and honey with a few pine needles, if using, until tender, about 20–25 minutes. Remove the pears and reduce the poaching liquid to a syrup.
  - Mash or blend the cooked chestnuts with the butter, ricotta and semolina into a soft, biscuit-like dough.
  - Shape into small biscotti or logs and bake at 180°C for about 20 minutes, until lightly golden.
  - Serve the marroni biscotti with the honey-poached pear, drizzled with the reduced syrup and finished with mint.
